AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Build a Flask image from GitHub and deploy it to an existing EKS cluster using
  CodeConnections, CodeBuild, and namespace-scoped Kubernetes RBAC.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: README.md
        has: setup, architecture, permissions, validation, and cleanup
        scope: stack
    must:
      - The existing cluster must be in the stack Region and support EKS access entries.
      - Apply rbac.yml as a cluster administrator before creating the stack.
      - ConnectionArn must identify an AVAILABLE connection authorized for the source repository.
Parameters:
  EksClusterName:
    Type: String
    Default: eksctl-demo
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9_-]*"
    MaxLength: 100
    Description: Existing EKS cluster in this stack's Region.
  GitHubUser:
    Type: String
    Default: mxagar
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-]*"
    MaxLength: 100
    Description: GitHub repository owner (case-sensitive).
  GitSourceRepo:
    Type: String
    Default: udacity_deployments_final_pipeline
    AllowedPattern: "[A-Za-z0-9_.-]+"
    MaxLength: 100
    Description: Repository containing Dockerfile and buildspec.yml at its root.
  GitBranch:
    Type: String
    Default: main
    MinLength: 1
    MaxLength: 255
    Description: Branch whose pushes trigger the pipeline.
  ConnectionArn:
    Type: String
    AllowedPattern: "arn:[^:]+:(codeconnections|codestar-connections):[^:]+:[0-9]{12}:connection/[A-Za-z0-9-]+"
    Description: An existing AVAILABLE GitHub CodeConnections connection in this Region.
  CodeBuildDockerImage:
    Type: String
    Default: aws/codebuild/standard:8.0
    AllowedValues:
      - aws/codebuild/standard:8.0
    Description: Ubuntu 24.04 x86-64 managed image with Python 3.13 and AWS CLI v2.
Conditions:
  LegacyConnection: !Equals [!Select [2, !Split [":", !Ref ConnectionArn]], codestar-connections]
Resources:
  EcrDockerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: keeps uniquely tagged application images available after stack deletion
        must:
          - Preserve retained images; remove them separately only after tests no longer need them.
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
  CodePipelineArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: private versioned pipeline artifacts; retained for failed-build investigation
        must:
          - Keep encryption, public-access blocking, and HTTPS enforcement.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodePipelineArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CodePipelineArtifactBucket.Arn
              - !Sub "${CodePipelineArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 14
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: build identity can access only this stack's artifacts, image repository, and logs
        must:
          - Keep Kubernetes deployment permissions on the separate deploy role.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}"
      Policies:
        - PolicyName: BuildArtifactsAndImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketVersioning, s3:ListBucket]
                Resource: !GetAtt CodePipelineArtifactBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${CodePipelineArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt EcrDockerRepository.Arn
  EksDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: native IAM resource replaces the old trust-policy-mutating Lambda
        must:
          - Trust only this stack's CodeBuild role.
          - Kubernetes permissions come from the access entry and rbac.yml, never system:masters.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt CodeBuildServiceRole.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DescribeTargetCluster
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EksClusterName}"
  CodeBuildEksPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: separate policy avoids circular dependencies between the two IAM roles
        must:
          - Allow assumption only of this stack's deploy role.
    Properties:
      PolicyName: DescribeAndAssumeDeployRole
      Roles: [!Ref CodeBuildServiceRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt EksDeployRole.Arn
          - Effect: Allow
            Action: eks:DescribeCluster
            Resource: !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EksClusterName}"
  EksDeployAccessEntry:
    Type: AWS::EKS::AccessEntry
    Metadata:
      com.aws.cloudformation.Context:
        why: maps the deploy role to a namespace-scoped Kubernetes group without aws-auth edits
        must:
          - rbac.yml must bind final-pipeline-deployer in deployment-tests.
          - The cluster authentication mode must be API or API_AND_CONFIG_MAP.
    Properties:
      ClusterName: !Ref EksClusterName
      PrincipalArn: !GetAtt EksDeployRole.Arn
      Type: STANDARD
      KubernetesGroups: [final-pipeline-deployer]
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildEksPolicy
      - EksDeployAccessEntry
    Metadata:
      com.aws.cloudformation.Context:
        why: builds and smoke-tests the image, then applies only application resources
        must:
          - Keep privileged mode for Docker and CODEPIPELINE source/artifacts.
          - RBAC bootstrap is performed by an administrator, never by the build.
    Properties:
      Name: !Ref AWS::StackName
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      TimeoutInMinutes: 20
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: !Ref CodeBuildDockerImage
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt EcrDockerRepository.RepositoryUri
          - Name: EKS_CLUSTER_NAME
            Value: !Ref EksClusterName
          - Name: EKS_KUBECTL_ROLE_ARN
            Value: !GetAtt EksDeployRole.Arn
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: connection access is limited to the selected repository and branch
        must:
          - Keep UseConnection scoped to ConnectionArn and source repository.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineSourceAndBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: !If [LegacyConnection, codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: !Ref ConnectionArn
                Condition: !If
                  - LegacyConnection
                  - StringEquals:
                      codestar-connections:FullRepositoryId: !Sub "${GitHubUser}/${GitSourceRepo}"
                      codestar-connections:BranchName: !Ref GitBranch
                  - StringEquals:
                      codeconnections:FullRepositoryId: !Sub "${GitHubUser}/${GitSourceRepo}"
                      codeconnections:BranchName: !Ref GitBranch
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketVersioning, s3:ListBucket]
                Resource: !GetAtt CodePipelineArtifactBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${CodePipelineArtifactBucket.Arn}/*"
  CodePipelineGitHub:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: ArtifactBucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: GitHub App source replaces personal tokens; queued builds prevent concurrent rollouts
        must:
          - Authorize ConnectionArn through the AWS console before deployment.
    Properties:
      Name: !Ref AWS::StackName
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: App
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Sub "${GitHubUser}/${GitSourceRepo}"
                BranchName: !Ref GitBranch
                DetectChanges: "true"
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: App
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: App
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
Outputs:
  DeployRoleArn:
    Description: IAM role mapped to the final-pipeline-deployer Kubernetes group.
    Value: !GetAtt EksDeployRole.Arn
  PipelineName:
    Description: Pipeline to release after pushing changes.
    Value: !Ref CodePipelineGitHub
  ImageRepository:
    Description: ECR repository retained after stack deletion.
    Value: !GetAtt EcrDockerRepository.RepositoryUri
  ArtifactBucket:
    Description: Artifact bucket retained after stack deletion.
    Value: !Ref CodePipelineArtifactBucket
