version: 0.2

env:
  shell: bash
  variables:
    UV_VERSION: "0.13.5"

phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      - bash scripts/pipeline.sh install
  pre_build:
    commands:
      - bash scripts/pipeline.sh pre-build
  build:
    commands:
      - bash scripts/pipeline.sh build
  post_build:
    commands:
      - bash scripts/pipeline.sh deploy

artifacts:
  files:
    - build.json
